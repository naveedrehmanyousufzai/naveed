# Change only the "repo" line below if your GitHub username or repo name changes.
backend:
  name: github
  repo: naveedrehmanyousufzai/naveed
  branch: main
  base_url: https://sveltia-cms-auth.nrehmanyousufzai.workers.dev

media_folder: "images"
public_folder: "images"

collections:
  - name: "results"
    label: "Tournament results"
    files:
      - name: "results"
        label: "All results"
        file: "content/results.json"
        fields:
          - label: "Results"
            name: "items"
            widget: "list"
            label_singular: "Result"
            summary: "{{fields.year}} - {{fields.tournament}} - {{fields.result}}"
            fields:
              - label: "Year"
                name: "year"
                widget: "string"
              - label: "Tournament"
                name: "tournament"
                widget: "string"
              - label: "Venue"
                name: "venue"
                widget: "string"
              - label: "Result"
                name: "result"
                widget: "string"
                hint: "Winner, Runner-up, Semi-final, Round of 16, and so on"
              - label: "Mark this as a win"
                name: "win"
                widget: "boolean"
                default: false

  - name: "news"
    label: "Press coverage"
    files:
      - name: "news"
        label: "All coverage"
        file: "content/news.json"
        fields:
          - label: "Articles"
            name: "items"
            widget: "list"
            label_singular: "Article"
            summary: "{{fields.source}} - {{fields.title}}"
            fields:
              - label: "Publication"
                name: "source"
                widget: "string"
              - label: "Headline"
                name: "title"
                widget: "string"
              - label: "Photo"
                name: "image"
                widget: "image"
                required: false
              - label: "Link to the article"
                name: "url"
                widget: "string"
                required: false
                default: "#"

  - name: "products"
    label: "Store"
    files:
      - name: "products"
        label: "All products"
        file: "content/products.json"
        fields:
          - label: "Products"
            name: "items"
            widget: "list"
            label_singular: "Product"
            summary: "{{fields.name}} - PKR {{fields.price}}"
            fields:
              - label: "Name"
                name: "name"
                widget: "string"
              - label: "Price in PKR"
                name: "price"
                widget: "string"
                hint: "Numbers only, for example 3,500"
              - label: "Category"
                name: "category"
                widget: "select"
                options: ["apparel", "gear", "coaching"]
              - label: "Photo"
                name: "image"
                widget: "image"
                required: false
              - label: "Description"
                name: "description"
                widget: "text"
                required: false
              - label: "Sold out"
                name: "sold_out"
                widget: "boolean"
                default: false

  - name: "home"
    label: "Home page"
    files:
      - name: "home"
        label: "Home page content"
        file: "content/home.json"
        fields:
          - label: "Career numbers"
            name: "stats"
            widget: "list"
            min: 4
            max: 4
            fields:
              - label: "Number"
                name: "number"
                widget: "string"
              - label: "Label underneath"
                name: "label"
                widget: "string"
          - label: "Featured result"
            name: "featured"
            widget: "object"
            fields:
              - label: "Date and place"
                name: "meta"
                widget: "string"
              - label: "Heading"
                name: "title"
                widget: "string"
              - label: "Description"
                name: "text"
                widget: "text"
              - label: "Photo"
                name: "image"
                widget: "image"
                required: false

  - name: "settings"
    label: "Settings"
    files:
      - name: "settings"
        label: "Contact details"
        file: "content/settings.json"
        fields:
          - label: "WhatsApp number"
            name: "whatsapp"
            widget: "string"
            hint: "Country code first, no plus sign and no spaces. For example 923001234567"
          - label: "Email address"
            name: "email"
            widget: "string"

  - name: "tournaments"
    label: "Tournaments"
    files:
      - name: "tournaments"
        label: "Tournament calendar"
        file: "content/tournaments.json"
        fields:
          - label: "Tournaments"
            name: "tournaments"
            widget: "list"
            label_singular: "Tournament"
            summary: "{{fields.name}} - {{fields.start}}"
            fields:
              - label: "Short id"
                name: "id"
                widget: "string"
                hint: "Lowercase letters, numbers and dashes only, no spaces. For example sindh-junior-2026. It becomes part of the web address, so do not change it later."
              - label: "Tournament name"
                name: "name"
                widget: "string"
              - label: "Location"
                name: "location"
                widget: "string"
                hint: "City and country, for example Karachi, Pakistan"
              - label: "Venue"
                name: "venue"
                widget: "string"
                required: false
              - label: "Venue address"
                name: "venue_address"
                widget: "string"
                required: false
              - label: "First day"
                name: "start"
                widget: "string"
                hint: "Year-month-day, for example 2026-10-21"
              - label: "Last day"
                name: "end"
                widget: "string"
                hint: "Year-month-day, for example 2026-10-25"
              - label: "Status"
                name: "status"
                widget: "select"
                options: ["auto", "Scheduled", "Upcoming", "In play", "Completed"]
                default: "auto"
                hint: "Leave on auto and the site works it out from the dates."
              - label: "Prize money"
                name: "prize_money"
                widget: "string"
                required: false
                hint: "For example PKR 400,000"
              - label: "Level"
                name: "level"
                widget: "string"
                required: false
                hint: "For example Provincial, Open, Circuit"
              - label: "Divisions"
                name: "divisions"
                widget: "list"
                label_singular: "Division"
                field: { label: "Division", name: "division", widget: "string" }
                hint: "For example Boys Under 13, Girls Under 15, Men, Women"
              - label: "Logo"
                name: "logo"
                widget: "image"
                required: false
                hint: "Shown on the big-screen scoreboard and the tournament page."
              - label: "Organiser"
                name: "organiser"
                widget: "string"
                required: false
              - label: "Promoter"
                name: "promoters"
                widget: "string"
                required: false
              - label: "Contact email"
                name: "contact"
                widget: "string"
                required: false
              - label: "Entry deadline"
                name: "entry_deadline"
                widget: "string"
                required: false
                hint: "Year-month-day and time, for example 2026-10-12T12:00"
              - label: "Withdrawal deadline"
                name: "withdrawal_deadline"
                widget: "string"
                required: false
                hint: "For example 2026-10-15T17:00"
              - label: "About this tournament"
                name: "description"
                widget: "text"
                required: false
              - label: "How to enter"
                name: "how_to_enter"
                widget: "text"
                required: false
              - label: "Referees"
                name: "referees"
                widget: "list"
                label_singular: "Referee"
                summary: "{{fields.name}} - {{fields.role}}"
                required: false
                fields:
                  - { label: "Name", name: "name", widget: "string" }
                  - { label: "Role", name: "role", widget: "string", required: false, hint: "Chief referee, Referee, Marker" }
              - label: "Entries"
                name: "entries"
                widget: "list"
                label_singular: "Entry"
                summary: "{{fields.name}} - {{fields.division}}"
                required: false
                fields:
                  - { label: "Player", name: "name", widget: "string" }
                  - { label: "Club", name: "club", widget: "string", required: false }
                  - { label: "Division", name: "division", widget: "string", hint: "Must match a division name above" }
                  - { label: "Seed", name: "seed", widget: "string", required: false }
              - label: "This is sample data"
                name: "sample"
                widget: "boolean"
                default: false
                required: false
                hint: "Turn off once you have replaced the sample text with the real details."

  - name: "rankings"
    label: "Rankings"
    files:
      - name: "rankings"
        label: "Player rankings"
        file: "content/rankings.json"
        fields:
          - label: "Categories"
            name: "categories"
            widget: "list"
            label_singular: "Category"
            field: { label: "Category", name: "category", widget: "string" }
            hint: "The order here is the order on the site. Names must match the Category on each player exactly."
          - label: "Players"
            name: "players"
            widget: "list"
            label_singular: "Player"
            summary: "{{fields.category}} {{fields.rank}}. {{fields.name}}"
            fields:
              - { label: "Category", name: "category", widget: "string", hint: "For example Boys Under 13, Girls Under 15, Men, Women" }
              - { label: "Rank", name: "rank", widget: "string" }
              - { label: "Player name", name: "name", widget: "string" }
              - { label: "Club", name: "club", widget: "string", required: false }
              - { label: "Ranking points", name: "points", widget: "string", required: false }
