# Change only the "repo" line below if your GitHub username or repo name changes.
backend:
  name: github
  repo: naveedrehmanyousufzai/naveed
  branch: main
  base_url: https://sveltia-cms-auth.nrehmanyousufzai.workers.dev

media_folder: "images"
public_folder: "images"

collections:
  - name: "results"
    label: "Tournament results"
    files:
      - name: "results"
        label: "All results"
        file: "content/results.json"
        fields:
          - label: "Results"
            name: "items"
            widget: "list"
            label_singular: "Result"
            summary: "{{fields.year}} - {{fields.tournament}} - {{fields.result}}"
            fields:
              - label: "Year"
                name: "year"
                widget: "string"
              - label: "Tournament"
                name: "tournament"
                widget: "string"
              - label: "Venue"
                name: "venue"
                widget: "string"
              - label: "Result"
                name: "result"
                widget: "string"
                hint: "Winner, Runner-up, Semi-final, Round of 16, and so on"
              - label: "Mark this as a win"
                name: "win"
                widget: "boolean"
                default: false

  - name: "news"
    label: "Press coverage"
    files:
      - name: "news"
        label: "All coverage"
        file: "content/news.json"
        fields:
          - label: "Articles"
            name: "items"
            widget: "list"
            label_singular: "Article"
            summary: "{{fields.source}} - {{fields.title}}"
            fields:
              - label: "Publication"
                name: "source"
                widget: "string"
              - label: "Headline"
                name: "title"
                widget: "string"
              - label: "Photo"
                name: "image"
                widget: "image"
                required: false
              - label: "Link to the article"
                name: "url"
                widget: "string"
                required: false
                default: "#"

  - name: "products"
    label: "Store"
    files:
      - name: "products"
        label: "All products"
        file: "content/products.json"
        fields:
          - label: "Products"
            name: "items"
            widget: "list"
            label_singular: "Product"
            summary: "{{fields.name}} - PKR {{fields.price}}"
            fields:
              - label: "Name"
                name: "name"
                widget: "string"
              - label: "Price in PKR"
                name: "price"
                widget: "string"
                hint: "Numbers only, for example 3,500"
              - label: "Category"
                name: "category"
                widget: "select"
                options: ["apparel", "gear", "coaching"]
              - label: "Photo"
                name: "image"
                widget: "image"
                required: false
              - label: "Description"
                name: "description"
                widget: "text"
                required: false
              - label: "Sold out"
                name: "sold_out"
                widget: "boolean"
                default: false

  - name: "home"
    label: "Home page"
    files:
      - name: "home"
        label: "Home page content"
        file: "content/home.json"
        fields:
          - label: "Career numbers"
            name: "stats"
            widget: "list"
            min: 4
            max: 4
            fields:
              - label: "Number"
                name: "number"
                widget: "string"
              - label: "Label underneath"
                name: "label"
                widget: "string"
          - label: "Featured result"
            name: "featured"
            widget: "object"
            fields:
              - label: "Date and place"
                name: "meta"
                widget: "string"
              - label: "Heading"
                name: "title"
                widget: "string"
              - label: "Description"
                name: "text"
                widget: "text"
              - label: "Photo"
                name: "image"
                widget: "image"
                required: false

  - name: "settings"
    label: "Settings"
    files:
      - name: "settings"
        label: "Contact details"
        file: "content/settings.json"
        fields:
          - label: "WhatsApp number"
            name: "whatsapp"
            widget: "string"
            hint: "Country code first, no plus sign and no spaces. For example 923001234567"
          - label: "Email address"
            name: "email"
            widget: "string"
