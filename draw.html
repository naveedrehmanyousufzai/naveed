<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tournament draw — NR Squash</title>
<meta name="description" content="The current tournament draw: brackets, groups and results.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800;900&family=Public+Sans:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="nav no-print">
  <div class="wrap nav__inner">
    <a class="nav__mark" href="squash.html" aria-label="NR Squash Portal">
      <img src="images/nr-logo-light.png" alt="NR Squash Portal">
    </a>
    <button class="nav__toggle" id="navToggle" aria-expanded="false" aria-controls="navLinks" aria-label="Menu"><span></span><span></span><span></span></button>
    <nav class="nav__links" id="navLinks">
      <a href="live.html">Live now</a>
      <a href="squash.html">Portal</a>
      <a href="squash.html#rankings">Rankings</a>
      <a href="index.html">Main site</a>
    </nav>
  </div>
</header>

<section class="wrap pagehead no-print">
  <h1>Tournament draw</h1>
  <p>The current draw. It updates as the organisers publish changes.</p>
</section>

<section class="section section--tight wrap">
  <hr class="rule no-print">
  <div class="dm__controls no-print" id="drawTools" hidden>
    <button class="btn btn--ghost" id="drawPrint">Print this draw</button>
  </div>
  <div id="drawRoot"><p class="pad__empty">Loading the draw…</p></div>
</section>

<script src="drawlogic.js"></script>
<script src="drawview.js"></script>
<script>
/* Public draw view: read only, refreshes itself so results appear. */
async function loadDraw() {
  try {
    const res = await fetch('/api/draw', { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const draw = await res.json();
    DrawView.render(document.getElementById('drawRoot'), draw);
    document.getElementById('drawTools').hidden = !draw;
  } catch (err) {
    document.getElementById('drawRoot').innerHTML =
      '<p class="pad__empty">The draw is not available right now. This page will keep trying.</p>';
  }
}
document.getElementById('drawPrint').addEventListener('click', () => window.print());
loadDraw();
setInterval(loadDraw, 30000);
</script>
<script src="app.js"></script>
</body>
</html>
