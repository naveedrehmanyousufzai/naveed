<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live scoreboard — NR Squash</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800;900&family=Public+Sans:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body class="board-body">

<!-- Full-screen venue scoreboard. Open on the display and press F11.
     Reads /api/live every few seconds. Nothing to operate here. -->
<main class="board" id="board">
  <p class="board__waiting" id="boardWaiting">Waiting for a live match…</p>

  <div class="board__live" id="boardLive" hidden>

    <header class="board__head">
      <img class="board__logo" id="bLogo" src="images/nr-logo-light.png" alt="">
      <div class="board__event">
        <h1 class="board__tournament" id="bTournament"></h1>
        <p class="board__round" id="bRound"></p>
      </div>
      <div class="board__clock">
        <span class="board__clocklabel">Game time</span>
        <span class="board__clocktime" id="bClock">0:00</span>
      </div>
    </header>

    <section class="board__players">
      <article class="board__player" id="bSide0">
        <p class="board__serve" id="bServe0"></p>
        <h2 class="board__name" id="bName0"></h2>
        <p class="board__dept" id="bDept0"></p>
        <p class="board__points" id="bPts0">0</p>
      </article>

      <div class="board__middle">
        <p class="board__gameslabel">Games</p>
        <p class="board__games"><span id="bG0">0</span><i>—</i><span id="bG1">0</span></p>
        <ul class="board__history" id="bHistory"></ul>
      </div>

      <article class="board__player" id="bSide1">
        <p class="board__serve" id="bServe1"></p>
        <h2 class="board__name" id="bName1"></h2>
        <p class="board__dept" id="bDept1"></p>
        <p class="board__points" id="bPts1">0</p>
      </article>
    </section>

    <footer class="board__foot">
      <span id="bState">Game 1 · first to 11, win by 2</span>
      <span class="board__stamp" id="bStamp"></span>
    </footer>
  </div>
</main>

<script src="scoreboard.js"></script>
</body>
</html>
