# Change only the "repo" line below if your GitHub username or repo name changes.
backend:
  name: github
  repo: naveedrehmanyousufzai/naveed
  branch: main
  base_url: https://sveltia-cms-auth.nrehmanyousufzai.workers.dev

media_folder: "images"
public_folder: "images"

collections:
  - name: "results"
    label: "Tournament results"
    files:
      - name: "results"
        label: "All results"
        file: "content/results.json"
        fields:
          - label: "Results"
            name: "items"
            widget: "list"
            label_singular: "Result"
            summary: "{{fields.year}} - {{fields.tournament}} - {{fields.result}}"
            fields:
              - label: "Year"
                name: "year"
                widget: "string"
              - label: "Tournament"
                name: "tournament"
                widget: "string"
              - label: "Venue"
                name: "venue"
                widget: "string"
              - label: "Result"
                name: "result"
                widget: "string"
                hint: "Winner, Runner-up, Semi-final, Round of 16, and so on"
              - label: "Mark this as a win"
                name: "win"
                widget: "boolean"
                default: false

  - name: "news"
    label: "Press coverage"
    files:
      - name: "news"
        label: "All coverage"
        file: "content/news.json"
        fields:
          - label: "Articles"
            name: "items"
            widget: "list"
            label_singular: "Article"
            summary: "{{fields.source}} - {{fields.title}}"
            fields:
              - label: "Publication"
                name: "source"
                widget: "string"
              - label: "Headline"
                name: "title"
                widget: "string"
              - label: "Photo"
                name: "image"
                widget: "image"
                required: false
              - label: "Link to the article"
                name: "url"
                widget: "string"
                required: false
                default: "#"

  - name: "products"
    label: "Store"
    files:
      - name: "products"
        label: "All products"
        file: "content/products.json"
        fields:
          - label: "Products"
            name: "items"
            widget: "list"
            label_singular: "Product"
            summary: "{{fields.name}} - PKR {{fields.price}}"
            fields:
              - label: "Name"
                name: "name"
                widget: "string"
              - label: "Price in PKR"
                name: "price"
                widget: "string"
                hint: "Numbers only, for example 3,500"
              - label: "Category"
                name: "category"
                widget: "select"
                options: ["apparel", "gear", "coaching"]
              - label: "Photo"
                name: "image"
                widget: "image"
                required: false
              - label: "Description"
                name: "description"
                widget: "text"
                required: false
              - label: "Sold out"
                name: "sold_out"
                widget: "boolean"
                default: false

  - name: "home"
    label: "Home page"
    files:
      - name: "home"
        label: "Home page content"
        file: "content/home.json"
        fields:
          - label: "Career numbers"
            name: "stats"
            widget: "list"
            min: 4
            max: 4
            fields:
              - label: "Number"
                name: "number"
                widget: "string"
              - label: "Label underneath"
                name: "label"
                widget: "string"
          - label: "Featured result"
            name: "featured"
            widget: "object"
            fields:
              - label: "Date and place"
                name: "meta"
                widget: "string"
              - label: "Heading"
                name: "title"
                widget: "string"
              - label: "Description"
                name: "text"
                widget: "text"
              - label: "Photo"
                name: "image"
                widget: "image"
                required: false

  - name: "settings"
    label: "Settings"
    files:
      - name: "settings"
        label: "Contact details"
        file: "content/settings.json"
        fields:
          - label: "WhatsApp number"
            name: "whatsapp"
            widget: "string"
            hint: "Country code first, no plus sign and no spaces. For example 923001234567"
          - label: "Email address"
            name: "email"
            widget: "string"

  - name: "portal"
    label: "Squash portal"
    files:
      - name: "portal"
        label: "Events, draw and rankings"
        file: "content/portal.json"
        fields:
          - label: "Events"
            name: "events"
            widget: "list"
            label_singular: "Event"
            summary: "{{fields.name}} - {{fields.status}}"
            fields:
              - label: "Tournament name"
                name: "name"
                widget: "string"
              - label: "Dates"
                name: "dates"
                widget: "string"
                hint: "For example 12-15 October 2026"
              - label: "Venue"
                name: "venue"
                widget: "string"
              - label: "Status"
                name: "status"
                widget: "select"
                options: ["Live", "Upcoming", "Completed"]
              - label: "Draw link"
                name: "draw_url"
                widget: "string"
                required: false
                hint: "Leave empty to hide the button. Use /draw.html for the draw tool."
              - label: "Live scores link"
                name: "live_url"
                widget: "string"
                required: false
                hint: "Leave empty to hide the button."

          - label: "Tournament draw"
            name: "bracket"
            widget: "object"
            fields:
              - label: "Tournament name"
                name: "title"
                widget: "string"
              - label: "Subtitle"
                name: "subtitle"
                widget: "string"
                required: false
              - label: "Rounds"
                name: "rounds"
                widget: "list"
                label_singular: "Round"
                summary: "{{fields.name}}"
                fields:
                  - label: "Round name"
                    name: "name"
                    widget: "string"
                    hint: "Quarterfinals, Semifinals, Final"
                  - label: "Matches"
                    name: "matches"
                    widget: "list"
                    label_singular: "Match"
                    summary: "{{fields.p1}} v {{fields.p2}}"
                    fields:
                      - label: "Player 1"
                        name: "p1"
                        widget: "string"
                        required: false
                      - label: "Player 1 seed"
                        name: "s1"
                        widget: "string"
                        required: false
                      - label: "Player 2"
                        name: "p2"
                        widget: "string"
                        required: false
                      - label: "Player 2 seed"
                        name: "s2"
                        widget: "string"
                        required: false
                      - label: "Score"
                        name: "score"
                        widget: "string"
                        required: false
                        hint: "For example 11-6, 11-4, 11-8"
                      - label: "Status"
                        name: "status"
                        widget: "select"
                        options: ["Live", "Upcoming", "Completed"]
                      - label: "Winner"
                        name: "winner"
                        widget: "select"
                        required: false
                        options: ["", "1", "2"]
                        hint: "1 if Player 1 won, 2 if Player 2 won, blank if not finished"

          - label: "Rankings"
            name: "rankings"
            widget: "list"
            label_singular: "Player"
            summary: "{{fields.rank}}. {{fields.name}} - {{fields.points}}"
            fields:
              - label: "Rank"
                name: "rank"
                widget: "string"
              - label: "Player name"
                name: "name"
                widget: "string"
              - label: "Category"
                name: "category"
                widget: "string"
                hint: "Senior, U19, U17, U15"
              - label: "Club"
                name: "club"
                widget: "string"
              - label: "Ranking points"
                name: "points"
                widget: "string"
