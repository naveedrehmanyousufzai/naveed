<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Squash Draw</title>
<style>
:root{--ink:#10171a;--paper:#fff;--line:#d8dee0;--line-strong:#10171a;--accent:#0f7a52;--accent-soft:#e4f3ec;--muted:#5c6b6f;}
*{box-sizing:border-box}
body{margin:0;font-family:"Helvetica Neue",Arial,sans-serif;background:#fff;color:var(--ink);padding:20px 16px 60px;}
.wrap{max-width:1300px;margin:0 auto;}
.top-bar{display:flex;justify-content:flex-end;margin-bottom:8px;}
.top-bar img{max-height:40px;max-width:110px;object-fit:contain;}
.tournament-logo{display:flex;justify-content:center;margin-bottom:10px;}
.tournament-logo img{max-height:90px;max-width:260px;object-fit:contain;}
.event-title{text-align:center;text-transform:uppercase;letter-spacing:.03em;border-bottom:2px solid var(--line-strong);padding-bottom:10px;margin:0 0 6px;}
.meta-note{text-align:center;color:var(--muted);font-size:.85rem;margin-bottom:20px;}
.live-tag{text-align:center;color:var(--accent);font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px;}
.empty-note{text-align:center;color:var(--muted);padding:60px 20px;font-size:.95rem;}
h3{font-size:.85rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:0 0 8px;text-align:center;}
.seed-tag{color:var(--muted);font-size:.75rem;margin-left:6px;}
.round-date-text{font-size:.72rem;color:var(--muted);margin-bottom:10px;text-align:center;}
.bracket-tree{display:flex;gap:32px;overflow-x:auto;align-items:stretch;}
.bracket-column{min-width:220px;flex:0 0 auto;display:flex;flex-direction:column;}
.matches-col{display:flex;flex-direction:column;justify-content:space-around;flex:1;}
.match-pair{position:relative;display:flex;flex-direction:column;justify-content:space-around;flex:1;}
.match-slot{position:relative;margin:6px 0;}
.match-pair .match-slot::after{content:"";position:absolute;top:50%;right:-16px;width:16px;height:0;border-top:1.5px solid var(--line-strong);}
.match-pair::before{content:"";position:absolute;top:25%;bottom:25%;right:-16px;width:0;border-right:1.5px solid var(--line-strong);}
.match-pair::after{content:"";position:absolute;top:50%;right:-32px;width:16px;height:0;border-top:1.5px solid var(--line-strong);}
.match-box{border:1px solid var(--line);border-radius:4px;margin:8px 0;overflow:hidden;}
.slot{padding:8px 10px;font-size:.9rem;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;}
.slot:last-child{border-bottom:none;}
.slot.bye{color:#aeb8ba;font-style:italic;}
.slot.winner{background:var(--accent-soft);font-weight:700;}
.score-display{padding:4px 10px;font-size:.72rem;color:var(--muted);border-top:1px dashed var(--line);display:flex;gap:6px;}
.walkover-tag,.duration-tag{padding:4px 10px;font-size:.7rem;color:var(--muted);font-style:italic;border-top:1px dashed var(--line);}
.groups-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px;}
.group-panel{border:1px solid var(--line);border-radius:6px;padding:14px 16px;}
.group-panel h3{text-align:left;border-bottom:2px solid var(--line-strong);padding-bottom:6px;}
.standings-table{width:100%;border-collapse:collapse;font-size:.85rem;margin-bottom:12px;}
.standings-table th,.standings-table td{padding:5px 6px;text-align:left;border-bottom:1px solid #f0f2f2;}
.standings-table th{color:var(--muted);font-size:.72rem;text-transform:uppercase;}
.rr-fixtures{display:flex;flex-direction:column;gap:6px;}
.rr-match{border:1px solid var(--line);border-radius:4px;padding:6px 8px;}
.rr-match-names{display:flex;gap:6px;font-size:.85rem;}
.rr-match-names .vs{color:var(--muted);}
.winner-name{font-weight:700;color:var(--accent);}
.section-heading{margin-top:36px;}
@media print{
  @page{size:landscape;margin:10mm;}
  body{padding:0;}
  .match-pair{break-inside:avoid;}
  .match-box{margin:3px 0;}
  .slot{padding:3px 6px;font-size:.68rem;}
  .walkover-tag,.duration-tag{padding:2px 6px;font-size:.6rem;}
}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="empty-note">Loading…</div></div>

<script>
// ---------- best-of-5 scoring (mirrors src/utils/scoring.ts) ----------
const GAMES_TO_WIN = 3;
function computeMatchResult(games) {
  let gamesWonA = 0, gamesWonB = 0;
  for (const g of games) {
    if (g.a === null || g.b === null) continue;
    if (g.a === g.b) continue;
    if (g.a > g.b) gamesWonA++; else gamesWonB++;
  }
  let winnerSide = null;
  if (gamesWonA >= GAMES_TO_WIN) winnerSide = "A";
  else if (gamesWonB >= GAMES_TO_WIN) winnerSide = "B";
  return { gamesWonA, gamesWonB, winnerSide };
}

// ---------- standings (mirrors src/utils/standings.ts) ----------
function computeStandings(group) {
  const rows = new Map();
  for (const player of group.players) rows.set(player.id, { player, played: 0, wins: 0, losses: 0, points: 0 });
  for (const match of group.matches) {
    const { winnerSide } = computeMatchResult(match.games);
    if (!winnerSide) continue;
    const a = rows.get(match.playerA.id);
    const b = rows.get(match.playerB.id);
    if (!a || !b) continue;
    a.played++; b.played++;
    if (winnerSide === "A") { a.wins++; a.points += 2; b.losses++; }
    else { b.wins++; b.points += 2; a.losses++; }
  }
  return Array.from(rows.values()).sort((r1, r2) => {
    if (r2.points !== r1.points) return r2.points - r1.points;
    if (r2.wins !== r1.wins) return r2.wins - r1.wins;
    return r1.player.name.localeCompare(r2.player.name);
  });
}

// ---------- rendering (mirrors src/utils/publish.ts) ----------
function esc(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function formatDateWithDay(iso) {
  if (!iso) return "";
  const [y, m, d] = iso.split("-").map(Number);
  const date = new Date(y, (m || 1) - 1, d || 1);
  return date.toLocaleDateString(undefined, { weekday: "long", day: "numeric", month: "long", year: "numeric" });
}
function roundName(roundIndex, totalRounds) {
  const fromEnd = totalRounds - roundIndex;
  if (fromEnd === 1) return "Final";
  if (fromEnd === 2) return "Semi-finals";
  if (fromEnd === 3) return "Quarter-finals";
  return `Round ${roundIndex + 1}`;
}
function renderMatchBoxHtml(match) {
  const { slotA, slotB, winner, resolved, isWalkover, durationMinutes } = match;
  const lineHtml = (player, pending) => {
    const isBye = !player && !pending;
    const isWinner = resolved && winner && player && winner.id === player.id;
    const label = player ? esc(player.name) : pending ? "TBD" : "BYE";
    const seedTag = player && player.seed !== undefined ? `<span class="seed-tag">[${player.seed}]</span>` : "";
    return `<div class="slot ${isWinner ? "winner" : ""} ${isBye || pending ? "bye" : ""}">${label}${seedTag}</div>`;
  };
  const scoreHtml = (slotA.player && slotB.player && !isWalkover)
    ? `<div class="score-display">${match.games.filter((g) => g.a !== null && g.b !== null).map((g) => `<span>${g.a}-${g.b}</span>`).join("")}</div>`
    : "";
  const walkoverHtml = isWalkover ? `<div class="walkover-tag">Walkover</div>` : "";
  const durationHtml = (resolved && durationMinutes != null) ? `<div class="duration-tag">${durationMinutes} min</div>` : "";
  return `<div class="match-box">${lineHtml(slotA.player, slotA.pending)}${lineHtml(slotB.player, slotB.pending)}${scoreHtml}${walkoverHtml}${durationHtml}</div>`;
}
function chunkPairs(arr) {
  const pairs = [];
  for (let i = 0; i < arr.length; i += 2) pairs.push(arr.slice(i, i + 2));
  return pairs;
}
function renderBracketHtml(bracket, roundDates) {
  const totalRounds = bracket.rounds.length;
  const columns = bracket.rounds.map((round, rIdx) => {
    const dateHtml = roundDates[rIdx] ? `<div class="round-date-text">${esc(formatDateWithDay(roundDates[rIdx]))}</div>` : "";
    const isLastRound = rIdx === totalRounds - 1;
    const matches = isLastRound
      ? round.map((match) => `<div class="match-slot">${renderMatchBoxHtml(match)}</div>`).join("")
      : chunkPairs(round).map((pair) => `<div class="match-pair">${pair.map((match) => `<div class="match-slot">${renderMatchBoxHtml(match)}</div>`).join("")}</div>`).join("");
    return `<div class="bracket-column"><h3>${esc(roundName(rIdx, totalRounds))}</h3>${dateHtml}<div class="matches-col">${matches}</div></div>`;
  }).join("");
  return `<div class="bracket-tree">${columns}</div>`;
}
function renderGroupsHtml(groups) {
  const panels = groups.map((group) => {
    const standings = computeStandings(group);
    const rows = standings.map((row) => `<tr><td>${esc(row.player.name)}${row.player.seed !== undefined ? `<span class="seed-tag">[${row.player.seed}]</span>` : ""}</td><td>${row.played}</td><td>${row.wins}</td><td>${row.losses}</td><td>${row.points}</td></tr>`).join("");
    const fixtures = group.matches.map((match) => {
      const { winnerSide } = computeMatchResult(match.games);
      const scores = match.games.filter((g) => g.a !== null && g.b !== null).map((g) => `<span>${g.a}-${g.b}</span>`).join("");
      const durationHtml = match.durationMinutes != null ? `<span class="duration-tag">${match.durationMinutes} min</span>` : "";
      return `<div class="rr-match"><div class="rr-match-names"><span class="${winnerSide === "A" ? "winner-name" : ""}">${esc(match.playerA.name)}</span><span class="vs">v</span><span class="${winnerSide === "B" ? "winner-name" : ""}">${esc(match.playerB.name)}</span></div><div class="score-display">${scores}</div>${durationHtml}</div>`;
    }).join("");
    return `<div class="group-panel"><h3>${esc(group.name)}</h3><table class="standings-table"><thead><tr><th>Player</th><th>P</th><th>W</th><th>L</th><th>Pts</th></tr></thead><tbody>${rows}</tbody></table><div class="rr-fixtures">${fixtures}</div></div>`;
  }).join("");
  return `<div class="groups-grid">${panels}</div>`;
}

function render(data) {
  const app = document.getElementById("app");
  if (!data) {
    app.innerHTML = `<div class="empty-note">No draw has been published yet. Check back soon.</div>`;
    return;
  }
  let body = "";
  if (data.tournamentLogo || data.brandLogo) {
    body += `<div class="top-bar">${data.brandLogo ? `<img src="${data.brandLogo}" alt="logo" />` : ""}</div>`;
  }
  if (data.tournamentLogo) {
    body += `<div class="tournament-logo"><img src="${data.tournamentLogo}" alt="Tournament logo" /></div>`;
  }
  if (data.eventName) body += `<h1 class="event-title">${esc(data.eventName)}</h1>`;
  body += `<p class="live-tag">● Live</p>`;

  if (data.format === "knockout" && data.bracket) {
    body += `<p class="meta-note">${data.bracket.drawSize}-draw knockout</p>`;
    body += renderBracketHtml(data.bracket, data.bracketRoundDates || {});
  } else if (data.groups) {
    body += `<p class="meta-note">${data.groups.length} group${data.groups.length === 1 ? "" : "s"} — round robin</p>`;
    body += renderGroupsHtml(data.groups);
    if (data.knockoutStageBracket) {
      body += `<h2 class="section-heading">Knockout Stage</h2>`;
      body += renderBracketHtml(data.knockoutStageBracket, data.stageRoundDates || {});
    }
  }
  app.innerHTML = body;
  if (data.eventName) document.title = data.eventName + " — Draw";
}

async function refresh() {
  try {
    const res = await fetch("/api/draw", { cache: "no-store" });
    const data = await res.json();
    render(data);
  } catch {
    // keep showing whatever was last rendered; try again next tick
  }
}

refresh();
setInterval(refresh, 15000);
</script>
</body>
</html>
